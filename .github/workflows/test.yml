# Reference on this file: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: Lint, build and test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Node packages
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build the Node.js tools
        run: pnpm --dir node build
      - name: Typecheck
        run: pnpm typecheck
      - name: Run the unit tests
        run: pnpm --dir node test
      - name: Packaged consumer contract test
        run: pnpm test:package
      - name: Install Chromium for the local example run
        run: pnpm --dir example_project exec playwright install --with-deps chromium
      - name: Test the example project locally
        run: pnpm --dir example_project test:local
      - name: Test the example project on BrowserStack
        run: pnpm --dir example_project test:browserstack
        env:
          BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
          BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}

      # The following steps will be replaced with automatic publishing
      - name: Pack the Node.js tools
        run: pnpm --dir node pack
      - name: Save the packages
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: node/*.tgz
          if-no-files-found: error
