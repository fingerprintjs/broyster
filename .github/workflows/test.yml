# Reference on this file: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: Lint, build and test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build the Node.js tools
        run: pnpm build
      - name: Install Playwright browsers (local example)
        run: pnpm playwright:install
      - name: Test the example project locally
        run: pnpm test:local
      - name: Test the example project on BrowserStack
        run: pnpm test:browserstack --concurrency 5 --debug
        env:
          BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
          BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}

      # The following steps will be replaced with automatic publishing
      - name: Pack the Node.js tools
        run: pnpm --filter @fpjs-incubator/broyster pack
      - name: Save the packages
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: node/*.tgz
          if-no-files-found: error
